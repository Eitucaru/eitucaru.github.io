<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <nav class="site-nav">
    <div class="wrap">
      <a class="mark" href="{{ '/' | relative_url }}">build<span>_</span>log</a>
      <ul>
        <li><a href="{{ '/roblox/' | relative_url }}">roblox</a></li>
        <li><a href="{{ '/bricks/' | relative_url }}">bricks</a></li>
        <li><a href="{{ site.github_url }}">github ↗</a></li>
      </ul>
    </div>
  </nav>

  {{ content }}

  <footer class="site-footer">
    <div class="wrap" style="display:flex; justify-content:space-between; width:100%; flex-wrap:wrap; gap:10px;">
      <span>© {{ 'now' | date: "%Y" }}</span>
      <span>
        <a href="{{ site.github_url }}">github</a>
        &nbsp;·&nbsp;
        <a href="{{ site.bricks_site_url }}">{{ site.bricks_site_name }}</a>
      </span>
    </div>
  </footer>
</body>
</html>
